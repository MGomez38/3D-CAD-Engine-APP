<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CADShop — 3D Shop & Architectural Drawings</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234c8dff' d='M12 2 L22 7 V17 L12 22 L2 17 V7 Z M12 4.3 L4.5 8 L12 11.7 L19.5 8 Z M4 9.8 V15.8 L11 19.3 V13.3 Z M20 9.8 L13 13.3 V19.3 L20 15.8 Z'/%3E%3C/svg%3E">
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="brand-mark">◆</span> CADShop
        </div>
        <div class="menu">
          <button id="btn-new" title="New project">New</button>
          <button id="btn-open" title="Open project (.cadshop.json)">Open</button>
          <button id="btn-save" title="Save project">Save</button>
          <span class="sep"></span>
          <button id="btn-undo" title="Undo (Ctrl+Z)">Undo</button>
          <button id="btn-redo" title="Redo (Ctrl+Y)">Redo</button>
          <span class="sep"></span>
          <button id="btn-sheet" class="accent" title="Generate a drawing sheet with orthographic views">Drawing Sheet…</button>
          <button id="btn-export-stl" title="Export geometry as STL">STL</button>
          <button id="btn-export-dxf" title="Export flat part profiles as DXF for plasma/laser cutting">DXF</button>
        </div>
        <div class="spacer"></div>
        <div class="views">
          <select id="display-style" title="Display style">
            <option value="shaded-edges">Shaded + Edges</option>
            <option value="shaded">Shaded</option>
            <option value="xray">X-Ray</option>
            <option value="wireframe">Wireframe</option>
          </select>
          <button data-view="iso" title="Isometric view">Iso</button>
          <button data-view="top" title="Plan view">Top</button>
          <button data-view="front" title="Front elevation">Front</button>
          <button data-view="right" title="Right elevation">Right</button>
          <button id="btn-zoom-fit" title="Zoom to fit (Shift+Z)">Fit</button>
          <button id="btn-palette" title="Command palette (Ctrl+K)">⌘K</button>
          <button id="btn-settings" title="Settings">⚙</button>
          <button id="btn-help" title="Help & shortcuts (H)">?</button>
        </div>
      </header>

      <div id="middle">
        <nav id="toolbar"><!-- tool buttons injected --></nav>
        <main id="viewport-wrap">
          <canvas id="viewport"></canvas>
          <div id="cursor-tip"></div>
        </main>
        <aside id="sidebar">
          <section class="panel" id="panel-layers">
            <h3>Layers</h3>
            <div id="layers-list"></div>
            <button id="btn-add-layer" class="small">+ Add layer</button>
          </section>
          <section class="panel" id="panel-scenes">
            <h3>Saved Views</h3>
            <div id="scenes-list" class="muted">None yet</div>
            <button id="btn-add-scene" class="small">+ Save current view</button>
          </section>
          <section class="panel" id="panel-entity">
            <h3>Entity</h3>
            <div id="entity-info" class="muted">Nothing selected</div>
          </section>
          <section class="panel" id="panel-cutlist">
            <h3>Cut List</h3>
            <div id="cutlist-body" class="muted">No parts yet</div>
            <button id="btn-cutlist-csv" class="small">Export CSV</button>
          </section>
          <section class="panel" id="panel-project">
            <h3>Project Info</h3>
            <label>Project <input id="pi-project" placeholder="Project name"></label>
            <label>Customer <input id="pi-customer" placeholder="Customer"></label>
            <label>Drawn by <input id="pi-author" placeholder="Your name"></label>
            <label>Drawing # <input id="pi-number" placeholder="A-101"></label>
          </section>
        </aside>
      </div>

      <footer id="statusbar">
        <span id="status-hint">Ready</span>
        <span id="autosave-ind">✓ Saved</span>
        <div class="spacer"></div>
        <span id="status-coords"></span>
        <label id="vcb-label">Command / Measurements
          <input id="vcb" autocomplete="off" spellcheck="false" placeholder="3' 6&quot; · 24,12 · @48&lt;45 · L, REC, W…">
        </label>
        <select id="units-select" title="Display units">
          <option value="arch">Feet & Inches</option>
          <option value="in">Decimal Inches</option>
          <option value="mm">Millimeters</option>
        </select>
      </footer>
    </div>
    <input type="file" id="file-open" accept=".json,application/json" hidden>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
